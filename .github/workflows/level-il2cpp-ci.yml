name: Level-IL2CPP CI

on:
  push:
    branches:
      - metro-game-structure
      - feature/level-il2cpp
  pull_request:
    branches:
      - metro-game-structure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    name: Build, test, and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet build --no-restore --configuration Release

      # Some existing tests explicitly verify Debug.Assert behavior.
      # Debug.Assert calls are conditional and are omitted from Release builds.
      - name: Run tests (Debug)
        run: dotnet test --configuration Debug

      - name: Publish Windows x64
        run: dotnet publish -c Release -r win-x64
        working-directory: ./Source/AssetRipper.GUI.Free/

      - name: Add build timestamp
        shell: pwsh
        run: Get-Date -AsUTC -Format o | Out-File ./Source/0Bins/AssetRipper.GUI.Free/Release/win-x64/publish/compile_time.txt

      # Match the repository's Publish workflow: upload the published app,
      # not the intermediate project/build directories.
      - name: Upload Windows x64 application
        uses: actions/upload-artifact@v7
        with:
          name: AssetRipper-Level-IL2CPP-win_x64
          path: |
            ./Source/0Bins/AssetRipper.GUI.Free/Release/win-x64/publish/AssetRipper.GUI.Free.exe
            ./Source/0Bins/AssetRipper.GUI.Free/Release/win-x64/publish/*.dll
            ./Source/0Bins/AssetRipper.GUI.Free/Release/win-x64/publish/*.so
            ./Source/0Bins/AssetRipper.GUI.Free/Release/win-x64/publish/*.dylib
            ./Source/0Bins/AssetRipper.GUI.Free/Release/win-x64/publish/compile_time.txt
          if-no-files-found: error
          retention-days: 14
