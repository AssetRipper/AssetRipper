name: Level-IL2CPP CI

on:
  push:
    branches:
      - metro-game-structure
      - feature/level-il2cpp
  pull_request:
    branches:
      - metro-game-structure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, and package (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet build --no-restore --configuration Release

      # Some existing tests explicitly verify Debug.Assert behavior.
      # Debug.Assert calls are conditional and are omitted from Release builds.
      - name: Run tests (Debug)
        run: dotnet test --configuration Debug

      # GitHub stores uploaded artifacts as downloadable ZIP archives.
      - name: Upload Release build
        uses: actions/upload-artifact@v4
        with:
          name: AssetRipper-Level-IL2CPP-Release
          path: Source/0Bins/Other/**/Release/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
